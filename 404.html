<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Telecraft</title>
<!-- GitHub Pages serves this file, with a 404 status, for any address the
     site does not have. It can be served at any depth, so every link and
     asset below is root-relative. Not indexed: it is not a page anybody
     should find through a search. -->
<meta name="robots" content="noindex">
<!-- The theme, resolved before the first paint. `tokens.css` carries dark on
     the bare :root so an unstamped document is still complete, which means a
     reader who chose light would otherwise see one dark frame. This is the
     only copy of the resolver that runs that early; `assets/theme.js` owns
     every later resolution and the two share the storage key. The console's
     `index.html` carries the same block for the same reason. -->
<script>
  ;(function () {
    try {
      var stored = localStorage.getItem('telecraft.theme')
      var choice = stored === 'light' || stored === 'dark' ? stored : 'system'
      document.documentElement.dataset.theme =
        choice === 'system'
          ? matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark'
          : choice
    } catch (error) {
      document.documentElement.dataset.theme = 'dark'
    }
  })()
</script>
<!-- The product's own mark: the card face's three reading bands, stacked and
     decreasing (identity.md), offered in every format a browser in support
     will take. The SVG alone was not enough: Safari has not reliably drawn
     one, and the default /favicon.ico request a static host answers with a
     404 left the reader looking at the browser's own placeholder. All of it
     is vendored from telecraft, where one SVG is the source for every
     format. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<!-- Self-hosted, like everything else (ADR-0019, ADR-0045 §5). The upright is
     the only face the first paint needs. The mono carries the panel labels,
     the outcome names and the command blocks, and the first of those is now
     inside the hero, so it is preloaded too. The italic is unused on this
     page. -->
<link rel="preload" href="/assets/fonts/AtkinsonHyperlegibleNext.woff2" as="font" type="font/woff2" crossorigin>
<!-- Faces, then values, then elements, then structure. The first three are
     copies of the console's, listed in `tools/vendored.json`. -->
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/theme.js" defer></script>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<!-- The landing page's chrome, by hand like the landing page's. Change it
     there and change it here. -->
<header class="topbar">
  <!-- The bare mark, at ascender height beside the wordmark, which is the
       arrangement the pack's own horizontal lockup uses. The geometry is
       `docs/branding/pack/telecraft-mark-mono.svg` unchanged; the fills are
       tokens rather than the hex the pack writes, because the pack ships one
       file per ground and a page that follows the reader's theme needs one
       drawing that works on both. It supports the word and does not replace
       it, so the wordmark stays live text. -->
  <a class="wordmark" href="/"><svg class="wordmark-mark" viewBox="0 0 18 16" aria-hidden="true"><rect x="0" y="0" width="2" height="16" rx="1" fill="var(--brand)"/><rect x="5" y="0" width="13" height="3" rx="1.5" fill="var(--colour-text)"/><rect x="5" y="6.5" width="10" height="3" rx="1.5" fill="var(--colour-text-muted)"/><rect x="5" y="13" width="7" height="3" rx="1.5" fill="var(--colour-text-faint)"/></svg><span class="wordmark-lead">Tele</span>craft</a>
  <nav class="topnav" aria-label="Site">
    <a href="/docs/">Documentation</a>
    <a href="https://github.com/telecraft-dev/telecraft">GitHub</a>
  </nav>
  <!-- Three states, not two: following the machine is the honest default and
       a switch cannot say it, so this is a radio group and not a toggle. Its
       marks are drawn in the sheet's own hairline stroke and each one carries
       its name for anybody the drawing does not reach. Unhidden by
       `assets/theme.js`: a control that cannot act is worse than no control,
       and without script the page still resolves to a complete theme from the
       bare :root block. -->
  <fieldset class="theme-control" hidden>
    <legend>Theme</legend>
    <label class="theme-option" title="Follow the system">
      <input type="radio" name="theme" value="system">
      <svg class="theme-mark" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3.2" width="12" height="8.2" rx="1.3"/><path d="M5.8 13.4h4.4"/></svg>
      <span>System</span>
    </label>
    <label class="theme-option" title="Light">
      <input type="radio" name="theme" value="light">
      <svg class="theme-mark" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.3v1.5M8 13.2v1.5M1.3 8h1.5M13.2 8h1.5M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1"/></svg>
      <span>Light</span>
    </label>
    <label class="theme-option" title="Dark">
      <input type="radio" name="theme" value="dark">
      <svg class="theme-mark" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.1 9.7A5.7 5.7 0 0 1 6.3 2.9a5.7 5.7 0 1 0 6.8 6.8Z"/></svg>
      <span>Dark</span>
    </label>
  </fieldset>
</header>

<main id="content">
  <section class="hero">
    <div class="hero-inner">
      <div class="hero-words">
        <p class="hero-plate"><span class="stamp">404</span></p>
        <h1>Page not found</h1>
        <p class="lede">There is no page at this address.</p>
        <p class="actions">
          <a class="action action-lead" href="/docs/">Read the documentation</a>
          <a class="action" href="/">Go to the home page</a>
        </p>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <p class="colophon"><a href="https://github.com/telecraft-dev/telecraft/blob/main/LICENSE">Elastic License 2.0</a> · © 2026 the Telecraft project</p>
</footer>
</body>
</html>
