name: Preview deploy

# Stage two of two: publish the site `preview.yml` built, and say where it
# went.
#
# Why this is a second workflow, and not two more steps in the first one.
# Deploying needs a credential, and stage one runs code from the pull
# request's branch, which may come from a fork. A `workflow_run` workflow runs
# the copy of this file that is on the default branch, whatever the branch
# under review says, and it is the only trigger besides `pull_request_target`
# that is given a writable token. Between those two, this is the one that also
# refuses to check the branch out: the only thing that crosses from stage one
# is an artifact, unpacked as data and never executed.
#
# So a pull request cannot reach the Cloudflare token by editing a workflow,
# by adding a dependency with an install script, or by any other route that
# needs its own code to run. It cannot edit this file's behaviour at all.
#
# Where the previews live, and why not under telecraft.dev. A preview of a
# fork's pull request is untrusted HTML. `pages.dev` is on the Public Suffix
# List, so one preview cannot set a cookie that reaches another, or reach
# anything of ours. A `preview.telecraft.dev` would put that same untrusted
# HTML inside the zone, which is the hole ADR-0072 §2 submitted
# `app.telecraft.dev` to the Public Suffix List to close. Previews stay on the
# vendor's own domain, deliberately.

on:
  workflow_run:
    workflows: ['Preview']
    types: [completed]

permissions:
  contents: read

# One deploy per branch at a time, newest wins. Stage one can finish out of
# order when a pull request is pushed to twice in quick succession, and the
# alias URL must never end up holding the older build.
concurrency:
  group: >-
    preview-deploy-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  # The Pages project, which decides the hostname: `<project>.pages.dev`.
  # Created once, by hand, with `wrangler pages project create`; the README
  # records the command. A workflow that created it on demand would be a
  # workflow that can create Pages projects.
  PAGES_PROJECT: telecraft

jobs:
  deploy:
    name: Publish the preview
    # Only a successful build, and only one that came from a pull request. A
    # manual run of stage one has no pull request to comment on and nothing to
    # name a preview branch after.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Read the artifacts of the run that triggered this one.
      actions: read
      # Comment on the pull request.
      pull-requests: write
      # Record the preview as a deployment, which is what puts it in the
      # pull request's Deployments box and in the repository's Environments
      # tab with a history. It replaces the commit status this used to
      # write: one fact reported twice is one fact that can disagree with
      # itself.
      deployments: write
    steps:
      - name: Take the built site from the build run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-preview
          path: _site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Take the pull request number from the build run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preview-meta
          path: meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The number is read as a number. It arrived from a run that executed
      # branch code, so it is input: anything that is not digits stops the job
      # here rather than reaching a shell, a URL, or an API call.
      - name: Read the pull request number
        id: pr
        run: |
          set -euo pipefail
          number="$(tr -dc '0-9' < meta/pr-number)"
          if [ -z "$number" ]; then
            echo "no pull request number in the build run's artifact" >&2
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "alias=pr-$number" >> "$GITHUB_OUTPUT"

      # Digits alone are not enough. The number names a pull request, and the
      # branch that wrote it could name somebody else's: its build would then
      # be published at that request's alias and reported in that request's
      # comment, in front of that request's reviewers. The named pull
      # request's head has to be the very commit this run was triggered for,
      # or the number is not this build's.
      - name: The number names the pull request this run built
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER)
            const expected = process.env.HEAD_SHA
            let pull
            try {
              ({ data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
              }))
            } catch (error) {
              core.setFailed(`pull request #${number} could not be read: ${error.message}`)
              return
            }
            if (pull.head.sha !== expected) {
              core.setFailed(`pull request #${number} is at ${pull.head.sha}, and this run built ${expected}`)
            }

      # Pinned exactly, like every dependency in `package.json`. Wrangler is
      # fetched rather than added to the project because nothing in this
      # repository builds with it: it is deployment tooling, and putting it in
      # `package.json` would put it in every contributor's `npm ci`.
      # Opened before the publish, so a run that dies half way is a failed
      # deployment rather than no record at all.
      #
      # One environment, not one per pull request. The Deployments box on a
      # pull request selects by head SHA, so every pull request still shows
      # its own; a `preview-pr-N` environment each would read better in the
      # Environments tab at the cost of a row per pull request ever opened,
      # and a workflow to tidy them.
      #
      # `auto_inactive` is off for the same reason: on, GitHub marks the
      # previous deployment in this environment inactive, and with several
      # pull requests open that is always somebody else's live preview.
      #
      # `required_contexts` is empty deliberately. It defaults to every
      # check on the ref, which would refuse to create the deployment while
      # any of them is still running, and this workflow runs while they are.
      - name: Open a deployment for this preview
        id: deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.HEAD_SHA,
              environment: 'preview',
              description: `Site preview for pull request #${process.env.PR_NUMBER}`,
              transient_environment: true,
              auto_merge: false,
              auto_inactive: false,
              required_contexts: [],
            })
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: data.id,
              state: 'in_progress',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
            core.setOutput('id', data.id)

      - name: Publish to Cloudflare Pages
        id: publish
        # Reported rather than thrown: the step after this one is what tells
        # a reviewer the preview is not there, and a job that stopped here
        # would leave the deployment open and the comment unwritten.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ steps.pr.outputs.alias }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.0 pages deploy _site \
            --project-name "$PAGES_PROJECT" \
            --branch "$BRANCH" \
            --commit-dirty=true

      # The alias URL, not the per-deployment hash. Cloudflare points
      # `<branch>.<project>.pages.dev` at that branch's latest deployment, so
      # this link stays right as the pull request is pushed to, and a reviewer
      # who bookmarked it is never reading a stale build.
      - name: Say where the preview is
        if: always() && steps.deployment.outputs.id
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_URL: https://${{ steps.pr.outputs.alias }}.${{ env.PAGES_PROJECT }}.pages.dev
          BUILD_RUN: ${{ github.event.workflow_run.id }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          PUBLISHED: ${{ steps.publish.outcome }}
        with:
          script: |
            const marker = '<!-- site-preview -->'
            const number = Number(process.env.PR_NUMBER)
            const url = process.env.PREVIEW_URL
            const published = process.env.PUBLISHED === 'success'
            const build = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.BUILD_RUN}`
            const body = published ? [
              marker,
              `**Preview:** ${url}`,
              '',
              `The whole site, built from this branch and the documentation on telecraft's \`main\`. The link points at this pull request's latest build, so it stays right as you push.`,
              '',
              `Landing page at \`/\`, documentation at \`/docs/\`. Built by [this run](${build}), which also attaches \`_site\` as an artifact if you would rather serve it yourself.`,
            ].join('\n') : [
              marker,
              '**Preview:** the publish step failed, so there is nothing to look at yet.',
              '',
              `The site built, so this is the publish and not the tree. [The run](${build}) has the error, and \`_site\` is attached to it if you would rather serve it yourself.`,
            ].join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100,
            })
            const mine = comments.find((comment) => comment.body && comment.body.includes(marker))

            // One comment per pull request, edited in place. A fresh comment
            // on every push turns a long review into a wall of build notices.
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: mine.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              })
            }

            // And the deployment closes, which is what fills in the
            // Deployments box on the pull request and the Environments tab.
            // A failed publish closes it as a failure: a deployment left
            // open reads as one still running, forever.
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: published ? 'success' : 'failure',
              environment_url: published ? url : undefined,
              log_url: build,
              description: published
                ? 'The site as this branch builds it'
                : 'The preview did not publish',
            })
