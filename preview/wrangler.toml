# The preview hostname's Worker. Deployed by hand, once, and again only when
# `worker.js` changes:
#
#   npx wrangler@4.127.0 deploy --config preview/wrangler.toml
#
# It is deliberately not deployed by a workflow. Nothing about it changes per
# pull request, and a workflow that could deploy a Worker on this zone would be
# a second thing holding a token that can serve content on telecraft.dev.

name = "telecraft-preview"
main = "worker.js"
compatibility_date = "2026-08-01"

# The Pages project the previews are published to. `preview-deploy.yml` has the
# same value as `PAGES_PROJECT`; changing one means changing the other.
[vars]
PAGES_PROJECT = "telecraft-dev"

# Every preview hostname, and nothing else on the zone. The Worker itself
# refuses any hostname that is not `site-<digits>.ci.`, so a route that matched
# more widely would still serve nothing else.
#
# This pattern is two labels deep, which Universal SSL does not cover. See the
# README: it needs Advanced Certificate Manager, or a flat hostname instead.
[[routes]]
pattern = "*.ci.telecraft.dev/*"
zone_name = "telecraft.dev"
