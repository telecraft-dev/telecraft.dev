<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telecraft — coming soon</title>
<meta name="description" content="Craft, govern, and verify OpenTelemetry across your whole estate. Source-available fleet and policy management for OpenTelemetry — coming soon.">
<!-- The theme, resolved before the first paint. `tokens.css` carries dark on
     the bare :root so an unstamped document is still complete, which means a
     reader who chose light would otherwise see one dark frame. This is the
     only copy of the resolver that runs that early; `assets/theme.js` owns
     every later resolution and the two share the storage key. The console's
     `index.html` carries the same block for the same reason. -->
<script>
  ;(function () {
    try {
      var stored = localStorage.getItem('telecraft.theme')
      var choice = stored === 'light' || stored === 'dark' ? stored : 'system'
      document.documentElement.dataset.theme =
        choice === 'system'
          ? matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark'
          : choice
    } catch (error) {
      document.documentElement.dataset.theme = 'dark'
    }
  })()
</script>
<!-- The product's own mark: the card face's three reading bands, stacked and
     decreasing (identity.md). Naming it here also stops the browser's default
     /favicon.ico request, which a static host answers with a 404. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- Self-hosted, like everything else (ADR-0019, ADR-0045 §5). The upright is
     the only face the first paint needs; the italic is unused on this page and
     the mono carries three words, so neither is worth a preload. -->
<link rel="preload" href="/assets/fonts/AtkinsonHyperlegibleNext.woff2" as="font" type="font/woff2" crossorigin>
<!-- Faces, then values, then elements, then structure. The first three are
     copies of the console's, listed in `tools/vendored.json`. -->
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/theme.js" defer></script>
</head>
<body>
<main>
  <h1 class="wordmark"><span class="wordmark-lead">Tele</span>craft</h1>
  <svg class="pulse" viewBox="0 0 560 60" role="img" aria-label="telemetry pulse line">
    <polyline points="0,30 120,30 150,30 165,12 180,48 195,20 210,38 225,30 300,30 330,30 345,8 360,52 375,30 470,30 560,30"/>
  </svg>
  <p class="tagline">Craft, govern, and verify OpenTelemetry across your whole
  estate. Source-available fleet &amp; policy management for OpenTelemetry —
  nothing in your telemetry path, git as the source of truth.</p>
  <div class="soon">Coming soon</div>
  <p class="links">
    <a href="https://github.com/telecraft-dev/telecraft">Follow the build on GitHub&nbsp;→</a>
  </p>
  <footer class="foot">
    <p class="colophon"><a href="https://github.com/telecraft-dev/telecraft/blob/main/LICENSE">Elastic License 2.0</a> · © 2026 the Telecraft project</p>
    <!-- Unhidden by `assets/theme.js`: a control that cannot act is worse
         than no control, and without script the page still resolves to a
         complete theme from the bare :root block. -->
    <label class="theme-control" hidden>
      <span>Theme</span>
      <select id="theme-choice">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
  </footer>
</main>
</body>
</html>
