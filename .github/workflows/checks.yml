name: Checks

# Four rules this site cannot break quietly, and a weekly look at the links
# that leave it. Nothing here deploys.
#
# The air gap (ADR-0019, ADR-0045 §5): nothing the browser fetches comes from
# another origin. It is checked twice, over two different trees. The source
# tree is what a pull request changes. `_site/` is what a reader is served,
# and most of it was written in telecraft-dev/telecraft and arrives through
# `docs/nav.yaml`. A page nobody here reviewed can carry a remote image, and
# the source pass cannot see it.
#
# The vendored design system: the tokens, the base sheet and the faces are
# authored in telecraft-dev/telecraft and copied here, because ADR-0047 asked
# for a versioned artefact and there is no versioning scheme yet
# (telecraft-dev/telecraft#86). A copy that nobody checks becomes a fork by
# accident, so the schedule exists as much as the pull-request trigger: drift
# happens upstream, on a day when nothing changed here.
#
# The house style: an em or en dash is never punctuation, which telecraft
# enforces over its whole tree and this repository did not enforce at all.
# Eighty-one had accumulated by the time anyone counted, and the one that
# mattered sat in the front door's `<title>`, which is what a browser prints
# on the tab. The check runs first and needs nothing installed.
#
# The build: `nav.yaml` is the contract, and `npm test` is what asserts the
# generator still honours it: `not_published`, link resolution, the shared
# page chrome, and the rule that `docs.css` reads the palette rather than
# forking it. The weekly run builds against telecraft's `main` as it stands
# that morning, which is the same thing a deploy would do, without deploying
# it.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, early. A week of drift is a week, not a release cycle.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Air gap, vendored design system, and the build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Both `tools/` scripts are plain Node with no dependencies, so they run
      # before `npm ci` and report on a bare checkout. They also run before the
      # documentation is checked out, so that "the source" means this
      # repository: telecraft's `docs/` is another repository's source and is
      # checked where it matters, in `_site/`, after the build.
      - name: No dash used as punctuation
        run: node tools/check-dashes.mjs

      - name: Nothing in the source is fetched from another origin
        run: node tools/check-external-assets.mjs

      - name: The vendored design system matches its source
        run: node tools/vendor.mjs check

      - name: Check out the documentation from telecraft-dev/telecraft
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: telecraft-dev/telecraft
          ref: main
          path: telecraft
          sparse-checkout: docs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - run: npm ci

      - run: npm test

      # `--strict` turns the generator's warnings into failures. A warning is
      # a link that did not resolve or a page that fell out of `nav.yaml`,
      # and on a pull request that is a finding, not a footnote. The deploy
      # builds without it, deliberately: a warning that arrives in upstream
      # documentation should surface here, not hold the whole site back.
      - name: The site builds from telecraft's documentation
        run: npm run build -- --docs telecraft/docs --strict

      - name: Nothing the built site fetches comes from another origin
        run: npm run check:external

  # A fifth rule, on the schedule only: the links that leave the site still
  # answer. It never runs on a pull request, because a third party's outage
  # is not a fact about the change under review, and links rot on days when
  # nothing changed here. Only external URLs are checked; whether internal
  # links resolve is the generator's own test suite's job.
  links:
    name: External links still answer
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Check out the documentation from telecraft-dev/telecraft
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: telecraft-dev/telecraft
          ref: main
          path: telecraft
          sparse-checkout: docs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - run: npm ci

      - name: Build the site
        run: npm run build -- --docs telecraft/docs

      - name: Every external link answers
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --scheme https --scheme http '_site/**/*.html'
          fail: true
